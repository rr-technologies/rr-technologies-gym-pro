<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RR Trinetra Billing - Settings</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.layout{display:flex;min-height:100vh}.sidebar{width:245px;background:#101d43;color:#fff;padding:20px 14px;display:flex;flex-direction:column}.brand{font-size:21px;font-weight:700;padding:10px 12px 25px}.brand small{display:block;font-size:11px;opacity:.65;margin-top:4px}.nav{display:flex;flex-direction:column;gap:6px}.nav a{color:#dce5ff;text-decoration:none;padding:13px 14px;border-radius:10px}.nav a:hover,.nav a.active{background:#2e63e8;color:#fff}.bottom{margin-top:auto}.main{flex:1;padding:32px}.top{border-bottom:1px solid #dde3ee;padding-bottom:20px}.top h1{margin:0;font-size:30px}.sub{color:#64708a;margin-top:6px}.panel{background:#fff;border:1px solid #e1e6ef;border-radius:15px;padding:25px;margin-top:25px;max-width:850px;box-shadow:0 6px 20px rgba(30,50,90,.06)}.form{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;font-size:13px;color:#5d6a82;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #d6dce8;border-radius:9px}.full{grid-column:1/-1}.buttons{margin-top:22px;display:flex;gap:10px}.btn{border:0;background:#2463e8;color:#fff;padding:11px 18px;border-radius:9px;cursor:pointer}.btn.secondary{background:#edf2ff;color:#2456bd}.msg{margin-top:12px;color:#159447;font-size:13px}@media(max-width:800px){.sidebar{width:200px}.form{grid-template-columns:1fr}}
</style></head>
<body><div class="layout"><aside class="sidebar"><div class="brand">RR Trinetra<small>Professional Billing System</small></div><nav class="nav"><a href="billing-dashboard.html">🏠 Dashboard</a><a href="billing.html">🧾 POS Billing</a><a href="products.html">📦 Products</a><a href="purchase.html">🛒 Purchase</a><a href="inventory.html">📊 Inventory</a><a href="customers.html">👥 Customers</a><a href="vendors.html">🏢 Vendors</a><a href="expenses.html">💰 Expenses</a><a href="payments.html">💳 Payments</a><a href="reports.html">📈 Reports</a></nav><div class="bottom nav"><a href="settings.html" class="active">⚙ Settings</a></div></aside>
<main class="main"><div class="top"><h1>Settings</h1><div class="sub">Business profile and billing preferences</div></div><div class="panel"><form id="settingsForm"><div class="form"><div class="field"><label>Business Name</label><input id="businessName"></div><div class="field"><label>Owner Name</label><input id="ownerName"></div><div class="field"><label>Mobile Number</label><input id="mobile"></div><div class="field"><label>Email</label><input id="email"></div><div class="field full"><label>Address</label><input id="address"></div><div class="field"><label>Receipt Prefix</label><input id="prefix"></div><div class="field"><label>Currency</label><input id="currency" value="₹"></div></div><div class="buttons"><button class="btn" type="submit">Save Settings</button><button class="btn secondary" type="button" id="backup">Backup Data</button><button class="btn secondary" type="button" id="restoreBtn">Restore Data</button><input id="restore" type="file" accept=".json" hidden></div><div class="msg" id="msg"></div></form></div></main></div>
<script>
const key='rrTrinetraSettings'; const ids=['businessName','ownerName','mobile','email','address','prefix','currency']; let data={}; try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){} ids.forEach(id=>document.getElementById(id).value=data[id]||document.getElementById(id).value||'');
document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault(); const o={}; ids.forEach(id=>o[id]=document.getElementById(id).value.trim()); localStorage.setItem(key,JSON.stringify(o)); document.getElementById('msg').textContent='Settings saved successfully.'};
document.getElementById('backup').onclick=()=>{const all={}; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); try{all[k]=JSON.parse(localStorage.getItem(k))}catch(e){all[k]=localStorage.getItem(k)}} const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(all,null,2)],{type:'application/json'}));a.download='RR-Trinetra-Billing-Backup.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('restoreBtn').onclick=()=>document.getElementById('restore').click(); document.getElementById('restore').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);Object.entries(o).forEach(([k,v])=>localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v)));document.getElementById('msg').textContent='Backup restored. Refreshing...';setTimeout(()=>location.reload(),700)}catch(err){document.getElementById('msg').textContent='Invalid backup file.'}};r.readAsText(f)};
</script></body></html>
